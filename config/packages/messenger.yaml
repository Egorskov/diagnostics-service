# Входящие события: ADR 0002, design.md change add-event-envelope-inbox.
framework:
    messenger:
        # неразобранное и упавшее после ретраев — в PostgreSQL: messenger:failed:show / failed:retry <id>
        failure_transport: failed

        default_bus: messenger.bus.default
        buses:
            messenger.bus.default:
                middleware:
                    - doctrine_ping_connection
                    # inbox внутри транзакции: отметка event_id коммитится вместе с изменениями хендлера
                    - doctrine_transaction
                    - App\Infrastructure\Messenger\InboxMiddleware

        transports:
            # Своя очередь на каждый exchange-источник; привязка — только routing keys событий MVP.
            # Ретраи (1 с → 2 с → 4 с) уходят через default exchange прямо в нашу очередь,
            # другие подписчики exchange их не получают.
            courses:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                serializer: App\Infrastructure\Messenger\EnvelopeSerializer
                retry_strategy: { max_retries: 3, delay: 1000, multiplier: 2 }
                options:
                    exchange: { name: courses.events, type: topic }
                    queues:
                        diagnostics.courses:
                            binding_keys: [path.assigned, task.started, task.completed, sandbox.run]

            # владелец time.logged — открытый вопрос (SPEC §11.1); если это Курсы, транспорт уходит в courses
            time:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                serializer: App\Infrastructure\Messenger\EnvelopeSerializer
                retry_strategy: { max_retries: 3, delay: 1000, multiplier: 2 }
                options:
                    exchange: { name: time.events, type: topic }
                    queues:
                        diagnostics.time:
                            binding_keys: [time.logged]

            # самый частый поток — отдельная очередь (SPEC §9 «Нагрузка»); в make consume идёт последним
            heartbeat:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                serializer: App\Infrastructure\Messenger\EnvelopeSerializer
                retry_strategy: { max_retries: 3, delay: 1000, multiplier: 2 }
                options:
                    exchange: { name: activity.events, type: topic }
                    queues:
                        diagnostics.heartbeat:
                            binding_keys: [activity.heartbeat]

            # Outbox сигналов (ADR 0005, п. 3): Doctrine-транспорт пишет через то же соединение,
            # поэтому сигнал коммитится вместе с signal_state. Читает его relay (RelaySignalHandler).
            # use_notify=false: LISTEN/NOTIFY требует триггер из auto_setup, без него опустевшая очередь
            # проверялась бы раз в check_delayed_interval (60 с); опрос раз в секунду проще и предсказуем.
            outbox:
                dsn: 'doctrine://default?queue_name=outbox&auto_setup=0'
                options: { use_notify: false }
                retry_strategy: { max_retries: 3, delay: 1000, multiplier: 2 }

            # Только отправка в exchange сигналов: свои сигналы мы не читаем, поэтому очередей нет
            signals:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                serializer: App\Infrastructure\Messenger\SignalSerializer
                options:
                    exchange: { name: diagnostics.events, type: topic }
                    queues: []

            # таблица messenger_messages создаётся миграцией, а не транспортом
            failed: 'doctrine://default?queue_name=failed&auto_setup=0'

        routing:
            App\Application\Signal\OutgoingSignal: outbox

when@test:
    framework:
        messenger:
            # без serialize: in-memory хранит свой TransportMessageIdStamp в стампах, а EnvelopeSerializer
            # их не переносит (design §4); тесты сами пропускают сырое тело через EnvelopeSerializer::decode()
            transports:
                courses: 'in-memory://'
                time: 'in-memory://'
                heartbeat: 'in-memory://'
                # outbox остаётся в тестовой базе: тесты проверяют, что он откатывается вместе с транзакцией
                signals: 'in-memory://'
                failed: 'in-memory://'
